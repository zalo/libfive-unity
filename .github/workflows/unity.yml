# Runs the EditMode test suite and builds standalone players with GameCI.
#
# Requires a Unity license in repository secrets (see https://game.ci/docs/github/activation):
#   UNITY_LICENSE (personal .ulf contents)   or   UNITY_EMAIL + UNITY_PASSWORD [+ UNITY_SERIAL]
# Without them the Unity jobs are skipped with a notice instead of failing.
name: Unity

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: unity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # unity-test-runner publishes the results as a check run.
  checks: write

jobs:
  check-license:
    name: Check Unity license secrets
    # Same-repo pull requests already ran on the branch push; only run PR jobs for forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || { [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; }; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Unity license secrets are not configured; skipping Unity test and build jobs."
          fi

  test:
    name: EditMode tests
    needs: check-license
    if: needs.check-license.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Check assembly names against native plugin names
        run: python3 native/check_assembly_names.py
      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-test-
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          testMode: EditMode
          artifactsPath: test-results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: test-results

  build:
    name: Build ${{ matrix.targetPlatform }}
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        targetPlatform: [StandaloneWindows64, StandaloneOSX, StandaloneLinux64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-
      - uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: libfive-unity
          allowDirtyBuild: true
      - uses: actions/upload-artifact@v7
        with:
          name: player-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}
