# Builds the native libfive plugin (core API + standard library in one shared library) for every
# desktop platform Unity supports, on every push to every branch and on pull requests. The binaries
# are always uploaded as run artifacts; pushes to master additionally publish a GitHub Release:
#
#   * the built binaries (+ .meta files) are committed to master,
#   * the patch version in Assets/libfive/package.json is bumped and tagged (vX.Y.Z),
#   * the release gets libfive-unity-vX.Y.Z.zip (drop-in Assets/libfive folder) and one zip per
#     native platform, with auto-generated notes.
#
# Platforms:
#   * Windows x86_64  -> Assets/libfive/Plugins/Windows/x86_64/libfive.dll   (static CRT, no redist needed)
#   * macOS universal -> Assets/libfive/Plugins/macOS/libfive.dylib          (arm64 + x86_64, ad-hoc signed)
#   * Linux x86_64    -> Assets/libfive/Plugins/Linux/x86_64/libfive.so      (static libstdc++/libpng)
#
# Caching (both keyed so that branches fall back to master's caches):
#   * vcpkg's binary cache holds the prebuilt dependencies (Boost, Eigen, libpng, zlib). It is
#     restored at the start and saved at the end of the job even if the build failed, so a broken
#     libfive build never throws away an hour of dependency compilation.
#   * sccache (GitHub Actions cache backend) caches every libfive object file, so a rebuild with
#     unchanged sources is mostly cache hits.
name: Native libfive

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      libfive_ref:
        description: libfive commit, branch or tag to build
        type: string
        default: c9e97343e0af998cd1696e85583eccba95532b96

# A newer push to the same branch supersedes a running build, except on master where a run may be
# in the middle of publishing a release.
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  LIBFIVE_REF: ${{ github.event.inputs.libfive_ref || 'c9e97343e0af998cd1696e85583eccba95532b96' }}
  # Must match "builtin-baseline" in native/vcpkg.json.
  VCPKG_COMMIT: 0c8f465c549616e897a34b9393054931fda6339c
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
  SCCACHE_GHA_ENABLED: "true"
  CMAKE_C_COMPILER_LAUNCHER: sccache
  CMAKE_CXX_COMPILER_LAUNCHER: sccache

jobs:
  windows-x64:
    name: Windows x86_64
    # Same-repo pull requests already ran on the branch push; only run PR jobs for forks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Check out libfive
        uses: actions/checkout@v7
        with:
          repository: libfive/libfive
          ref: ${{ env.LIBFIVE_REF }}
          path: native/libfive
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-x64-windows-static-${{ env.VCPKG_COMMIT }}-${{ hashFiles('native/vcpkg.json', 'native/triplets/**') }}
          restore-keys: vcpkg-${{ runner.os }}-x64-windows-static-
      - uses: mozilla-actions/sccache-action@v0.0.11
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Set up vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:VCPKG_DEFAULT_BINARY_CACHE | Out-Null
          git clone https://github.com/microsoft/vcpkg.git "$env:RUNNER_TEMP\vcpkg"
          git -C "$env:RUNNER_TEMP\vcpkg" checkout $env:VCPKG_COMMIT
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
      - name: Build
        shell: pwsh
        env:
          VCPKG_ROOT: ${{ runner.temp }}\vcpkg
        run: ./native/build.ps1 -Triplet x64-windows-static -Config Release
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats
      - name: Check dependencies
        shell: pwsh
        run: |
          $dll = "native/build/x64-windows-static/libfive.dll"
          if (Get-Command dumpbin -ErrorAction SilentlyContinue) { dumpbin /DEPENDENTS $dll } else { Write-Host "dumpbin not on PATH; skipping" }
      - name: Stage plugin
        shell: pwsh
        run: python native/install_plugin.py --platform windows-x64 --binary native/build/x64-windows-static/libfive.dll --repo "$env:RUNNER_TEMP/stage"
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-windows-x64
          path: ${{ runner.temp }}/stage
          if-no-files-found: error

  macos-universal:
    name: macOS universal (arm64 + x86_64)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Check out libfive
        uses: actions/checkout@v7
        with:
          repository: libfive/libfive
          ref: ${{ env.LIBFIVE_REF }}
          path: native/libfive
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-osx-${{ env.VCPKG_COMMIT }}-${{ hashFiles('native/vcpkg.json', 'native/triplets/**') }}
          restore-keys: vcpkg-${{ runner.os }}-osx-
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Set up vcpkg and pkg-config
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          brew list pkg-config >/dev/null 2>&1 || brew install pkg-config
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_COMMIT"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - name: Build arm64
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: ./native/build.sh arm64-osx -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Build x86_64
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: ./native/build.sh x64-osx -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats
      - name: Create universal binary
        run: |
          lipo -create \
            native/build/arm64-osx/libfive/libfive/src/libfive.dylib \
            native/build/x64-osx/libfive/libfive/src/libfive.dylib \
            -output native/build/libfive.dylib
          codesign --force --sign - native/build/libfive.dylib
          lipo -info native/build/libfive.dylib
          otool -L native/build/libfive.dylib
          if otool -L native/build/libfive.dylib | grep -q -e /opt/homebrew -e /usr/local; then
            echo "::error::libfive.dylib links against Homebrew libraries" && exit 1
          fi
      - name: Stage plugin
        run: python3 native/install_plugin.py --platform macos-universal --binary native/build/libfive.dylib --repo "$RUNNER_TEMP/stage"
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-macos-universal
          path: ${{ runner.temp }}/stage
          if-no-files-found: error

  linux-x64:
    name: Linux x86_64
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # Oldest supported image = oldest glibc the binary will require.
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: Check out libfive
        uses: actions/checkout@v7
        with:
          repository: libfive/libfive
          ref: ${{ env.LIBFIVE_REF }}
          path: native/libfive
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-x64-linux-${{ env.VCPKG_COMMIT }}-${{ hashFiles('native/vcpkg.json', 'native/triplets/**') }}
          restore-keys: vcpkg-${{ runner.os }}-x64-linux-
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Set up vcpkg
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config ninja-build
          git clone https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" checkout "$VCPKG_COMMIT"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - name: Build
        env:
          VCPKG_ROOT: ${{ runner.temp }}/vcpkg
        run: ./native/build.sh x64-linux -G Ninja
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats
      - name: Check dependencies
        run: |
          ldd native/build/x64-linux/libfive/libfive/src/libfive.so
          if ldd native/build/x64-linux/libfive/libfive/src/libfive.so | grep -q -e libpng -e libstdc++; then
            echo "::error::libfive.so should not depend on shared libpng/libstdc++" && exit 1
          fi
      - name: Stage plugin
        run: python3 native/install_plugin.py --platform linux-x64 --binary native/build/x64-linux/libfive/libfive/src/libfive.so --repo "$RUNNER_TEMP/stage"
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-linux-x64
          path: ${{ runner.temp }}/stage
          if-no-files-found: error

  release:
    name: Release (master)
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [windows-x64, macos-universal, linux-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          pattern: plugin-*
          merge-multiple: true
          path: .
      - name: Bump version
        id: version
        run: |
          git fetch --tags --quiet
          VERSION=$(python3 - <<'EOF'
          import json, subprocess
          path = "Assets/libfive/package.json"
          pkg = json.load(open(path))
          tags = set(subprocess.check_output(["git", "tag", "-l"], text=True).split())
          major, minor, patch = (int(x) for x in pkg["version"].split("."))
          patch += 1
          while f"v{major}.{minor}.{patch}" in tags:
              patch += 1
          pkg["version"] = f"{major}.{minor}.{patch}"
          with open(path, "w") as f:
              json.dump(pkg, f, indent=2)
              f.write("\n")
          print(pkg["version"])
          EOF
          )
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION"
      - name: Commit binaries and version, tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/libfive/Plugins Assets/libfive/package.json
          git commit -m "Release v$VERSION [skip ci]" \
            -m "Native libfive $LIBFIVE_REF built by the Native libfive workflow (run $GITHUB_RUN_ID)."
          git tag -a "v$VERSION" -m "libfive-unity v$VERSION"
          git pull --rebase origin master
          git push origin master --follow-tags
      - name: Package release assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          # Drop-in package: unzip into your project's Assets folder (or add via UPM git URL).
          cp README.md LICENSE Assets/libfive/
          (cd Assets && zip -qr "../dist/libfive-unity-v$VERSION.zip" libfive libfive.meta)
          rm Assets/libfive/README.md Assets/libfive/LICENSE
          (cd Assets/libfive/Plugins && zip -qr "../../../dist/libfive-native-windows-x64-v$VERSION.zip" Windows Windows.meta)
          (cd Assets/libfive/Plugins && zip -qr "../../../dist/libfive-native-macos-universal-v$VERSION.zip" macOS macOS.meta)
          (cd Assets/libfive/Plugins && zip -qr "../../../dist/libfive-native-linux-x64-v$VERSION.zip" Linux Linux.meta)
          ls -la dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --title "libfive-unity v$VERSION" \
            --generate-notes \
            --notes "Native libfive: \`$LIBFIVE_REF\`. Built for Unity 6000.3 LTS.

          **Install:** unzip \`libfive-unity-v$VERSION.zip\` into your project's \`Assets\` folder, or add \`https://github.com/${{ github.repository }}.git?path=/Assets/libfive#v$VERSION\` in the Unity Package Manager (\"Add package from git URL\")."
